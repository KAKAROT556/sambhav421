
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System Diagnostics</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    height: 100%;
    width: 100%;
    font-family: "Courier New", Consolas, monospace;
  }

  #terminal {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 24px;
    color: #33ff66;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    background: #000;
    z-index: 2;
    text-shadow: 0 0 4px rgba(51,255,102,0.5);
  }

  #cursor {
    display: inline-block;
    background: #33ff66;
    width: 8px;
    height: 14px;
    animation: blink 1s steps(1) infinite;
    vertical-align: middle;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
    opacity: 0;
    transition: opacity 3s ease-in;
  }

  #skip {
    position: absolute;
    bottom: 12px;
    right: 16px;
    z-index: 5;
    color: #114422;
    font-family: monospace;
    font-size: 11px;
    background: transparent;
    border: 1px solid #114422;
    padding: 4px 8px;
    cursor: pointer;
  }
  #skip:hover { color: #33ff66; border-color: #33ff66; }

  #reveal {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.2s ease-in;
    font-family: "Courier New", Consolas, monospace;
  }
  #reveal.show { opacity: 1; }
  #reveal h1 {
    color: #33ff66;
    font-size: 54px;
    letter-spacing: 6px;
    margin: 0 0 14px 0;
    text-shadow: 0 0 14px rgba(51,255,102,0.85), 0 0 32px rgba(51,255,102,0.5);
  }
  #reveal p {
    color: #8fffb0;
    font-size: 16px;
    margin: 0;
    opacity: 0.85;
  }
</style>
</head>
<body>

<div id="terminal"></div>
<canvas id="matrix"></canvas>
<div id="reveal">
  <h1>RELAX. IT'S JUST A PRANK.</h1>
  <p>no system was harmed &mdash; nice reflexes though</p>
</div>
<button id="skip" onclick="skipToMatrix()">skip intro</button>

<script>
const lines = [
  "root@core-relay:~# initiating secure session...",
  "connecting to 10.42.117.8:8022 ... OK",
  "authenticating handshake [RSA-4096] ... verified",
  "",
  "loading kernel modules:",
  "  [ok] net_filter",
  "  [ok] io_scheduler",
  "  [ok] crypto_engine",
  "  [ok] proc_monitor",
  "",
  "mounting remote filesystem /mnt/remote_fs ... done",
  "scanning open ports on subnet 10.42.117.0/24 ...",
  "  10.42.117.3   22/tcp   open   ssh",
  "  10.42.117.9   443/tcp  open   https",
  "  10.42.117.14  3306/tcp open   mysql",
  "",
  "bypassing firewall ruleset ... 3 rules disabled",
  "injecting payload into buffer 0x7F3A2C ... done",
  "escalating privileges ... root access granted",
  "",
  "decrypting archive vault_002.enc ...",
  "  [##########----------] 48%",
  "  [####################] 100%",
  "",
  "access granted.",
  "launching matrix protocol",
];

const term = document.getElementById('terminal');
let lineIndex = 0;
let charIndex = 0;
let buffer = "";

function typeNextChar() {
  if (lineIndex >= lines.length) {
    setTimeout(startMatrix, 700);
    return;
  }
  const current = lines[lineIndex];
  if (charIndex < current.length) {
    buffer += current[charIndex];
    charIndex++;
    term.innerHTML = buffer + '<span id="cursor"></span>';
    setTimeout(typeNextChar, 12 + Math.random() * 18);
  } else {
    buffer += "\n";
    lineIndex++;
    charIndex = 0;
    term.innerHTML = buffer + '<span id="cursor"></span>';
    const pause = current === "" ? 80 : 90 + Math.random() * 160;
    setTimeout(typeNextChar, pause);
  }
}

let matrixStarted = false;
function skipToMatrix() {
  if (matrixStarted) return;
  startMatrix();
}

function startMatrix() {
  if (matrixStarted) return;
  matrixStarted = true;
  document.getElementById('skip').style.display = 'none';

  const canvas = document.getElementById('matrix');
  canvas.style.opacity = '1';
  term.style.transition = 'opacity 1.5s ease-out';
  term.style.opacity = '0';

  const ctx = canvas.getContext('2d');
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789";
  const fontSize = 16;
  let columns = Math.floor(canvas.width / fontSize);
  let drops = new Array(columns).fill(1);

  function draw() {
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#33ff66";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  const rainInterval = setInterval(draw, 45);

  window.addEventListener('resize', () => {
    columns = Math.floor(canvas.width / fontSize);
    drops = new Array(columns).fill(1);
  });

  // let the rain run for a while, then land the reveal
  setTimeout(() => {
    const reveal = document.getElementById('reveal');
    reveal.classList.add('show');
    canvas.style.transition = 'opacity 2.5s ease-out';
    canvas.style.opacity = '0.15';
  }, 8000);
}

setTimeout(typeNextChar, 400);
</script>

</body>
</html>
