<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>System Access</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  canvas#matrix {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.5;
  }

  #terminal {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    color: #0f0;
    text-shadow: 0 0 6px #0f0;
  }
  #terminal .line { font-size: 15px; margin-bottom: 8px; min-height: 20px; white-space: pre-wrap; line-height: 1.4; }
  #terminal .cursor { display: inline-block; width: 8px; background: #0f0; animation: blink 0.8s infinite; }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

  body.shake { animation: shake 0.4s infinite; }
  @keyframes shake {
    0% { transform: translate(0,0); }
    25% { transform: translate(-4px, 3px); }
    50% { transform: translate(4px, -3px); }
    75% { transform: translate(-3px, -4px); }
    100% { transform: translate(3px, 4px); }
  }

  #reveal {
    display: none;
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    text-align: center;
    color: #fff;
  }
  #reveal.show { display: block; }
  body.reveal-mode {
    background: linear-gradient(135deg, #ff6ec4, #7873f5, #4facfe);
    background-size: 200% 200%;
    animation: gradientMove 3s ease infinite;
  }
  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .emoji { font-size: 64px; margin-bottom: 10px; }
  #reveal h1 { font-size: 34px; margin-bottom: 12px; text-shadow: none; }
  #reveal p { font-size: 17px; line-height: 1.6; }

  .confetti {
    position: fixed;
    top: -10px;
    width: 8px; height: 14px;
    z-index: 3;
    opacity: 0.9;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); }
  }
</style>
</head>
<body id="body">

<canvas id="matrix"></canvas>

<div id="terminal">
  <div class="line" id="l1"></div>
  <div class="line" id="l2"></div>
  <div class="line" id="l3"></div>
  <div class="line" id="l4"></div>
  <div class="line" id="l5"></div>
  <div class="line" id="l6"></div>
</div>

<div id="reveal">
  <div class="emoji">🎉</div>
  <h1>Gotcha!</h1>
  <p>Nothing was hacked.<br>You just got pranked 😂</p>
</div>

<script>
  // Matrix rain
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  const chars = "アイウエオカキクケコサシスセソ01234567890$#@%&";
  const fontSize = 16;
  let columns, drops;
  function setupDrops() {
    columns = Math.floor(canvas.width / fontSize);
    drops = Array(columns).fill(1);
  }
  setupDrops();
  function drawMatrix() {
    ctx.fillStyle = "rgba(0,0,0,0.08)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#0f0";
    ctx.font = fontSize + "px monospace";
    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  const matrixInterval = setInterval(drawMatrix, 40);

  // Typing terminal lines
  const lines = [
    { el: document.getElementById('l1'), text: "> connection established: 192.168.4.1" },
    { el: document.getElementById('l2'), text: "> bypassing security... [OK]" },
    { el: document.getElementById('l3'), text: "> scanning /photos /contacts /messages" },
    { el: document.getElementById('l4'), text: "> extracting data... 87% complete" },
    { el: document.getElementById('l5'), text: "> uploading to remote server..." },
    { el: document.getElementById('l6'), text: "> ...relax, just kidding! 😂" }
  ];

  let lineIndex = 0;
  function typeLine() {
    if (lineIndex >= lines.length) {
      setTimeout(finish, 300);
      return;
    }
    const { el, text } = lines[lineIndex];
    let i = 0;
    el.innerHTML = '';
    const type = setInterval(() => {
      el.textContent = text.slice(0, i) + ' ';
      i++;
      if (i > text.length) {
        clearInterval(type);
        lineIndex++;
        if (lineIndex === 5) document.body.classList.add('shake');
        setTimeout(typeLine, 150);
      }
    }, 12);
  }
  setTimeout(typeLine, 200);

  function finish() {
    document.body.classList.remove('shake');
    clearInterval(matrixInterval);
    document.getElementById('terminal').style.display = 'none';
    document.getElementById('reveal').classList.add('show');
    document.body.classList.add('reveal-mode');
    launchConfetti();
  }

  function launchConfetti() {
    const colors = ['#ff6ec4', '#7873f5', '#4facfe', '#ffd166', '#06d6a0'];
    for (let i = 0; i < 60; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animation = `fall ${2 + Math.random() * 2}s linear forwards`;
      c.style.animationDelay = (Math.random() * 0.6) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4500);
    }
  }
</script>

</body>
</html>
